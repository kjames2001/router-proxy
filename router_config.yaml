classifier:
  model: GLM-4.7-Flash-MXFP4_MOE
  base_url: http://docker-ssd:8002/v1
  api_key_env: ''
  fasttext:
    enabled: true
    model_path: .router/fasttext/model.ftz
    confidence_threshold: 0.68
  setfit:
    enabled: true
    model_path: .router/setfit
    confidence_threshold: 0.55
  surrogate:
    enabled: true
    path: .router/surrogate
    confidence_threshold: 0.85
  laya:
    enabled: true
    model: convaiinnovations/laya-multilingual
    device: cpu
    confidence_threshold: 0.3
  profile_hint: simple
  system_prompt: 'Classify the user''s message into exactly one of these categories:

    {categories}


    Examples:

    "Hello" → chat

    "Write a Python function" → code

    "Deploy to Proxmox" → devops

    "What is quantum computing?" → research

    "Thanks!" → chat

    "Debug nginx 502" → code


    Reply with ONLY the category name, nothing else.


    "{message}" →

    '
  session_timeout_minutes: 5
  zero_shot:
    enabled: true
    model_name: all-MiniLM-L6-v2
    confidence_threshold: 0.25
    descriptions:
      chat:
      - hello how are you
      - thanks a lot
      - what is this
      - simple question
      - good morning
      - hi there
      - bye see you
      - ok got it
      - what time is it
      - what does it mean
      - explain simply
      - thanks
      - hi
      - hey
      - hello
      - good evening
      - how are you doing
      - what is the weather
      - thanks for the help
      - that makes sense
      - got it thanks
      - 你好
      - 谢谢
      - 早上好
      - 再见
      - 好的
      code:
      - write a python function
      - debug this error
      - fix this bug
      - refactor this code
      - implement a function
      - create a class
      - write unit tests
      - code review this PR
      - git commit and push
      - fix the regex pattern
      - handle exceptions in python
      - implement oauth2 flow
      - write a bash script
      - create a decorator
      - optimize this sql query
      - write a typescript interface
      - fix memory leak
      - implement a cache
      - write a dockerfile
      - algorithm implementation
      - data structure design
      - merge conflict resolution
      - pull request review
      - async await refactor
      - lambda function
      - error traceback
      devops:
      - deploy to proxmox lxc
      - configure nginx reverse proxy
      - docker compose setup
      - kubernetes deployment
      - systemd service configuration
      - ssl certificate certbot
      - tailscale vpn setup
      - ssh key management
      - backup and restore
      - proxmox snapshot
      - firewall configuration
      - caddy server setup
      - github actions ci cd
      - disk space full
      - out of memory error
      - permission denied
      - connection refused
      - 502 bad gateway
      - docker container networking
      - port forwarding
      - infrastructure as code
      - server configuration
      research:
      - compare different approaches
      - research paper analysis
      - literature review on
      - benchmark evaluation
      - academic study on
      - survey of methods
      - analyze the results
      - evaluate performance
      - methodology comparison
      - statistical analysis
      - arxiv paper summary
      - citation analysis
      - market research
      - trend analysis
      - data analysis report
      - experiment results
      homeassistant:
      - home assistant automation
      - create ha automation
      - configure zigbee2mqtt
      - esphome esp32 setup
      - mqtt broker configuration
      - smart home automation
      - zha device pairing
      - ha blueprint
      - energy dashboard setup
      - device tracker
      - binary sensor template
      - ha scene creation
      - frigate integration ha
      - motion sensor automation
      - light automation
      - thermostat control
      - zigbee device
      - home assistant script
categories:
  chat:
    label: Chat & Trivia
    model: deepseek-v4-flash
    base_url: https://ollama.com/v1
    api_key_env: OLLAMA_API_KEY_2
    alternate_key_env: OLLAMA_API_KEY
    timeout_seconds: 120
    fallback_model: deepseek-v4-flash
    fallback_base_url: https://api.deepseek.com/v1
    fallback_key_env: DEEPSEEK_API_KEY
    fallback_alternate_key_env: DEEPSEEK_API_KEY
  code:
    label: Code & Debug
    model: deepseek-v4-pro
    base_url: https://ollama.com/v1
    api_key_env: OLLAMA_API_KEY
    alternate_key_env: OLLAMA_API_KEY_2
    timeout_seconds: 300
    fallback_model: deepseek-v4-pro
    fallback_base_url: https://api.deepseek.com/v1
    fallback_key_env: DEEPSEEK_API_KEY
    fallback_alternate_key_env: DEEPSEEK_API_KEY
  devops:
    label: DevOps & Infra
    model: deepseek-v4-pro
    base_url: https://ollama.com/v1
    api_key_env: OLLAMA_API_KEY
    alternate_key_env: OLLAMA_API_KEY_2
    timeout_seconds: 300
    fallback_model: deepseek-v4-pro
    fallback_base_url: https://api.deepseek.com/v1
    fallback_key_env: DEEPSEEK_API_KEY
    fallback_alternate_key_env: DEEPSEEK_API_KEY
  research:
    label: Research & Analysis
    model: deepseek-v4-pro
    base_url: https://ollama.com/v1
    api_key_env: OLLAMA_API_KEY
    alternate_key_env: OLLAMA_API_KEY_2
    timeout_seconds: 300
    fallback_model: deepseek-v4-pro
    fallback_base_url: https://api.deepseek.com/v1
    fallback_key_env: DEEPSEEK_API_KEY
    fallback_alternate_key_env: DEEPSEEK_API_KEY
  homeassistant:
    label: Home Assistant
    model: deepseek-v4-flash
    base_url: https://ollama.com/v1
    api_key_env: OLLAMA_API_KEY_2
    alternate_key_env: OLLAMA_API_KEY
    timeout_seconds: 120
    fallback_model: deepseek-v4-flash
    fallback_base_url: https://api.deepseek.com/v1
    fallback_key_env: DEEPSEEK_API_KEY
    fallback_alternate_key_env: DEEPSEEK_API_KEY
